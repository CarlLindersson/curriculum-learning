name: Deploy curriculum game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt

      - name: Install Pygbag
        run: python -m pip install -r requirements-web.txt

      - name: Insert the public web configuration
        env:
          SUPABASE_FUNCTION_URL: ${{ vars.SUPABASE_FUNCTION_URL }}
          DATA_CONTROLLER_NAME: ${{ vars.DATA_CONTROLLER_NAME }}
          DATA_CONTROLLER_EMAIL: ${{ vars.DATA_CONTROLLER_EMAIL }}
          DATA_RETENTION_PERIOD: ${{ vars.DATA_RETENTION_PERIOD }}
        run: python configure_web_build.py

      - name: Build WebAssembly game
        run: python -m pygbag --build --ume_block 0 --title "Curriculum Learning Game" scripts

      - name: Disable Jekyll processing
        run: touch scripts/build/web/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: scripts/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
